<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1060" viewBox="0 0 1680 1060" role="img" aria-labelledby="t d">
  <title id="t">消息总线 · 生产消费、主题划分、分区与后端切换</title>
  <desc id="d">ThingsBoard 消息总线内部：生产者写入、消费者读取、主题按用途切分、按 tenantId+entityId 一致性哈希分区、由 TB_QUEUE_TYPE 在内存与 Kafka 两种后端间切换。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc;}
      .title{font:800 34px 'Inter',Arial,sans-serif;fill:#0f172a;}
      .sub{font:400 16px 'Inter',Arial,sans-serif;fill:#475569;}
      .h{font:800 18px 'Inter',Arial,sans-serif;fill:#0f172a;}
      .bt{font:700 16px 'Inter',Arial,sans-serif;fill:#0f172a;}
      .tx{font:400 13.5px 'Inter',Arial,sans-serif;fill:#334155;}
      .ti{font:400 12px 'Inter',Arial,sans-serif;fill:#64748b;}
      .cd{font:600 12.5px Menlo,Consolas,monospace;fill:#334155;}
      .lbl{font:600 12.5px 'Inter',Arial,sans-serif;fill:#64748b;}
      .bus{fill:#ecfeff;stroke:#0891b2;stroke-width:2.2;}
      .chip{fill:#ffffff;stroke:#67e8f9;stroke-width:1.6;}
      .amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;}
      .blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;}
      .teal{fill:#ecfdf5;stroke:#059669;stroke-width:2;}
      .violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;}
      .white{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.8;}
      .panel{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.6;}
      .part{fill:#f0f9ff;stroke:#7dd3fc;stroke-width:1.8;}
      .aCyan{fill:none;stroke:#0891b2;stroke-width:2.6;marker-end:url(#mc);}
      .aSlate{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#ms);}
    </style>
    <marker id="mc" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M2,2 L9,5.5 L2,9 Z" fill="#0891b2"/></marker>
    <marker id="ms" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M2,2 L9,5.5 L2,9 Z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1680" height="1060"/>

  <text class="title" x="60" y="54">消息总线 · 跨服务通信的中转站</text>
  <text class="sub" x="62" y="84">生产者写入、消费者读取，主题按用途切分；分区决定落点，后端可在内存与 Kafka 间切换</text>

  <!-- producers -->
  <text class="lbl" x="60" y="118">生产者 Producers · 谁在写入</text>
  <rect class="amber" x="60" y="128" width="300" height="86" rx="11"/><text class="bt" x="210" y="166" text-anchor="middle">传输层</text><text class="ti" x="210" y="190" text-anchor="middle">上行遥测 / 属性</text>
  <rect class="blue" x="420" y="128" width="300" height="86" rx="11"/><text class="bt" x="570" y="166" text-anchor="middle">TB Core</text><text class="ti" x="570" y="190" text-anchor="middle">状态 · 通知 · 下发</text>
  <rect class="teal" x="780" y="128" width="300" height="86" rx="11"/><text class="bt" x="930" y="166" text-anchor="middle">规则引擎</text><text class="ti" x="930" y="190" text-anchor="middle">处理结果回写</text>
  <line class="aCyan" x1="210" y1="214" x2="210" y2="264"/>
  <line class="aCyan" x1="570" y1="214" x2="570" y2="264"/>
  <line class="aCyan" x1="930" y1="214" x2="930" y2="264"/>

  <!-- bus -->
  <rect class="bus" x="60" y="268" width="1020" height="282" rx="14"/>
  <text class="h" x="84" y="302" fill="#0e7490">消息总线 · common/queue</text>
  <text class="ti" x="84" y="324">所有跨服务通信经此解耦；主题按用途切分，互不干扰</text>
  <rect class="chip" x="84" y="338" width="232" height="36" rx="9"/><text class="cd" x="200" y="361" text-anchor="middle">tb_rule_engine</text>
  <rect class="chip" x="328" y="338" width="170" height="36" rx="9"/><text class="cd" x="413" y="361" text-anchor="middle">tb_core</text>
  <rect class="chip" x="510" y="338" width="246" height="36" rx="9"/><text class="cd" x="633" y="361" text-anchor="middle">tb_transport.api</text>
  <rect class="chip" x="768" y="338" width="288" height="36" rx="9"/><text class="cd" x="912" y="361" text-anchor="middle">tb_core.notifications</text>
  <rect class="chip" x="84" y="384" width="226" height="36" rx="9"/><text class="cd" x="197" y="407" text-anchor="middle">tb_usage_stats</text>
  <rect class="chip" x="322" y="384" width="186" height="36" rx="9"/><text class="cd" x="415" y="407" text-anchor="middle">js-executor</text>
  <rect class="chip" x="520" y="384" width="216" height="36" rx="9"/><text class="cd" x="628" y="407" text-anchor="middle">version-control</text>
  <rect class="chip" x="748" y="384" width="230" height="36" rx="9"/><text class="cd" x="863" y="407" text-anchor="middle">tb_housekeeper</text>
  <rect class="chip" x="84" y="430" width="210" height="36" rx="9"/><text class="cd" x="189" y="453" text-anchor="middle">tb_ota_package</text>
  <rect class="chip" x="306" y="430" width="150" height="36" rx="9"/><text class="cd" x="381" y="453" text-anchor="middle">tb_edge</text>
  <text class="ti" x="84" y="500">统一模板：AbstractTbQueueConsumerTemplate · TbQueueProducerProvider（各服务一套）</text>
  <text class="ti" x="84" y="524">每个主题可独立配置分区数、保留时长、min.insync 等参数</text>

  <!-- bus -> consumers -->
  <line class="aCyan" x1="210" y1="550" x2="210" y2="600"/>
  <line class="aCyan" x1="570" y1="550" x2="570" y2="600"/>
  <line class="aCyan" x1="930" y1="550" x2="930" y2="600"/>

  <!-- consumers -->
  <text class="lbl" x="780" y="592" text-anchor="start">消费者 Consumers · 谁在读取</text>
  <rect class="blue" x="60" y="604" width="300" height="86" rx="11"/><text class="bt" x="210" y="642" text-anchor="middle">TB Core</text><text class="ti" x="210" y="666" text-anchor="middle">更新状态 · 推送前端</text>
  <rect class="teal" x="420" y="604" width="300" height="86" rx="11"/><text class="bt" x="570" y="642" text-anchor="middle">规则引擎</text><text class="ti" x="570" y="666" text-anchor="middle">规则链处理</text>
  <rect class="violet" x="780" y="604" width="300" height="86" rx="11"/><text class="bt" x="930" y="642" text-anchor="middle">EDQS</text><text class="ti" x="930" y="666" text-anchor="middle">维护内存索引</text>

  <!-- partition panel -->
  <rect x="1120" y="128" width="500" height="562" rx="14" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.8"/>
  <text class="h" x="1146" y="162" fill="#0369a1">分区 · Partitioning</text>
  <text class="ti" x="1146" y="186">决定每个实体由哪个节点处理</text>

  <rect class="white" x="1150" y="204" width="440" height="64" rx="10"/>
  <text class="bt" x="1370" y="232" text-anchor="middle">实体键</text>
  <text class="cd" x="1370" y="254" text-anchor="middle">tenantId + entityId</text>
  <line class="aSlate" x1="1370" y1="268" x2="1370" y2="300"/>
  <text class="lbl" x="1388" y="290">一致性哈希</text>

  <rect class="white" x="1150" y="304" width="104" height="58" rx="9"/><text class="bt" x="1202" y="339" text-anchor="middle">P0</text>
  <rect class="white" x="1262" y="304" width="104" height="58" rx="9"/><text class="bt" x="1314" y="339" text-anchor="middle">P1</text>
  <rect class="white" x="1374" y="304" width="104" height="58" rx="9"/><text class="bt" x="1426" y="339" text-anchor="middle">P2</text>
  <rect class="white" x="1486" y="304" width="104" height="58" rx="9"/><text class="bt" x="1538" y="339" text-anchor="middle">P3</text>
  <text class="ti" x="1370" y="384" text-anchor="middle">分区 Partitions</text>
  <line class="aSlate" x1="1370" y1="392" x2="1370" y2="420"/>

  <rect class="part" x="1150" y="424" width="138" height="64" rx="9"/><text class="bt" x="1219" y="462" text-anchor="middle">节点 A</text>
  <rect class="part" x="1300" y="424" width="138" height="64" rx="9"/><text class="bt" x="1369" y="462" text-anchor="middle">节点 B</text>
  <rect class="part" x="1450" y="424" width="140" height="64" rx="9"/><text class="bt" x="1520" y="462" text-anchor="middle">节点 C</text>
  <text class="ti" x="1370" y="510" text-anchor="middle">规则引擎节点 Nodes</text>

  <rect x="1150" y="528" width="440" height="146" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text class="tx" x="1170" y="556">同一实体的消息，恒定落到同一分区、</text>
  <text class="tx" x="1170" y="580">再到同一节点。顺序与状态由此保持一致；</text>
  <text class="tx" x="1170" y="604">增加节点即可线性扩容，无需打散单个实体。</text>
  <text class="ti" x="1170" y="640">这是有状态流处理的标准解法——既要顺序，</text>
  <text class="ti" x="1170" y="660">又要水平扩展，一致性哈希同时满足两者。</text>

  <!-- backend switch -->
  <rect class="panel" x="60" y="724" width="1560" height="300" rx="14"/>
  <text class="h" x="84" y="760">队列后端 · 由一个开关切换</text>
  <rect class="white" x="600" y="738" width="480" height="40" rx="20"/>
  <text class="cd" x="840" y="764" text-anchor="middle">TB_QUEUE_TYPE：in-memory | kafka</text>

  <rect class="white" x="90" y="800" width="720" height="200" rx="12"/>
  <text class="bt" x="120" y="838">In-Memory · 进程内内存队列</text>
  <text class="tx" x="120" y="870">单体形态的默认选项，无需任何外部依赖</text>
  <text class="tx" x="120" y="898">整套服务装在同一个 JVM 里，开箱即用</text>
  <text class="tx" x="120" y="926">适合概念验证、中小规模与边缘现场部署</text>
  <text class="ti" x="120" y="962">扩展上限受单机资源约束</text>

  <rect class="white" x="870" y="800" width="700" height="200" rx="12"/>
  <text class="bt" x="900" y="838">Apache Kafka · 跨节点消息骨干</text>
  <text class="tx" x="900" y="870">集群形态的选项，支持跨节点分区与持久化</text>
  <text class="tx" x="900" y="898">消息可保留与回溯，消费进度独立维护</text>
  <text class="tx" x="900" y="926">适合海量设备、高吞吐、组件独立伸缩的场景</text>
  <text class="ti" x="900" y="962">代价是运维复杂度与组件数量上升</text>
</svg>
