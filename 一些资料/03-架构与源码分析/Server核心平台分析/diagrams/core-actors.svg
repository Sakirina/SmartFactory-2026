<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000" role="img" aria-labelledby="t d">
  <title id="t">核心处理层 · Actor 体系的层级与消息路由</title>
  <desc id="d">ThingsBoard Actor 体系：AppActor 到 TenantActor 再派生 DeviceActor、RuleChainActor、CalculatedFieldManagerActor 等子 Actor，每个实体独享邮箱、串行处理消息、就地隔离故障。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc;}
      .title{font:800 34px 'Inter',Arial,sans-serif;fill:#0f172a;}
      .sub{font:400 16px 'Inter',Arial,sans-serif;fill:#475569;}
      .bt{font:800 19px 'Inter',Arial,sans-serif;fill:#0f172a;}
      .bt2{font:700 16px 'Inter',Arial,sans-serif;fill:#0f172a;}
      .tx{font:400 13.5px 'Inter',Arial,sans-serif;fill:#334155;}
      .ti{font:400 12.5px 'Inter',Arial,sans-serif;fill:#64748b;}
      .cd{font:600 12px Menlo,Consolas,monospace;fill:#475569;}
      .h{font:800 17px 'Inter',Arial,sans-serif;fill:#0f172a;}
      .root{fill:#f1f5f9;stroke:#475569;stroke-width:2.2;}
      .tenant{fill:#eef2ff;stroke:#4f46e5;stroke-width:2.2;}
      .blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2.2;}
      .teal{fill:#ecfdf5;stroke:#059669;stroke-width:2.2;}
      .violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.2;}
      .slate{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;}
      .queue{fill:#ecfeff;stroke:#0891b2;stroke-width:2.2;}
      .panel{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.6;}
      .ar{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#m);}
      .arc{fill:none;stroke:#0891b2;stroke-width:2.4;marker-end:url(#mc);}
    </style>
    <marker id="m" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M2,2 L9,5.5 L2,9 Z" fill="#64748b"/></marker>
    <marker id="mc" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M2,2 L9,5.5 L2,9 Z" fill="#0891b2"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1680" height="1000"/>

  <text class="title" x="60" y="54">核心处理层 · Actor 体系</text>
  <text class="sub" x="62" y="84">一个实体一个 Actor，消息进邮箱排队、串行处理；层层派生，就地隔离故障</text>

  <!-- queue source -->
  <rect class="queue" x="60" y="252" width="200" height="92" rx="12"/>
  <text class="bt2" x="160" y="290" text-anchor="middle">消息来源</text>
  <text class="ti" x="160" y="314" text-anchor="middle">规则引擎队列</text>
  <text class="cd" x="160" y="332" text-anchor="middle">tb_rule_engine</text>
  <path class="arc" d="M260,290 C 540,290 560,278 700,278"/>

  <!-- AppActor -->
  <rect class="root" x="730" y="128" width="220" height="74" rx="12"/>
  <text class="bt" x="840" y="166" text-anchor="middle">AppActor</text>
  <text class="ti" x="840" y="188" text-anchor="middle">系统根 · 顶层监督</text>
  <line class="ar" x1="840" y1="202" x2="840" y2="238"/>

  <!-- TenantActor -->
  <rect class="tenant" x="710" y="242" width="260" height="74" rx="12"/>
  <text class="bt" x="840" y="280" text-anchor="middle">TenantActor</text>
  <text class="ti" x="840" y="302" text-anchor="middle">租户隔离边界</text>

  <!-- branch lines -->
  <path class="ar" d="M840,316 C 840,380 270,366 270,424"/>
  <path class="ar" d="M840,316 C 840,380 710,366 710,424"/>
  <path class="ar" d="M840,316 C 840,380 1160,366 1160,424"/>
  <path class="ar" d="M840,316 C 840,380 1500,366 1500,424"/>

  <!-- DeviceActor -->
  <rect class="blue" x="120" y="430" width="300" height="100" rx="12"/>
  <text class="bt2" x="270" y="466" text-anchor="middle">DeviceActor</text>
  <text class="ti" x="270" y="492" text-anchor="middle">维护单台设备的会话、订阅、状态</text>
  <text class="ti" x="270" y="512" text-anchor="middle">上行消息在此进入规则链</text>

  <!-- RuleChainActor -->
  <rect class="teal" x="560" y="430" width="300" height="100" rx="12"/>
  <text class="bt2" x="710" y="466" text-anchor="middle">RuleChainActor</text>
  <text class="ti" x="710" y="492" text-anchor="middle">驱动一条规则链的执行</text>
  <text class="ti" x="710" y="512" text-anchor="middle">把消息派发给链中的节点</text>
  <line class="ar" x1="710" y1="530" x2="710" y2="566"/>
  <rect class="teal" x="560" y="570" width="300" height="92" rx="12"/>
  <text class="bt2" x="710" y="606" text-anchor="middle">RuleNodeActor</text>
  <text class="ti" x="710" y="632" text-anchor="middle">执行链中的单个规则节点</text>
  <text class="ti" x="710" y="650" text-anchor="middle">过滤 · 富化 · 转换 · 动作</text>

  <!-- CFManagerActor -->
  <rect class="violet" x="1010" y="430" width="320" height="100" rx="12"/>
  <text class="bt2" x="1170" y="466" text-anchor="middle">CalculatedFieldManagerActor</text>
  <text class="ti" x="1170" y="492" text-anchor="middle">管理计算字段的调度</text>
  <text class="ti" x="1170" y="512" text-anchor="middle">按实体分发计算任务</text>
  <line class="ar" x1="1170" y1="530" x2="1170" y2="566"/>
  <rect class="violet" x="1020" y="570" width="300" height="92" rx="12"/>
  <text class="bt2" x="1170" y="606" text-anchor="middle">CFEntityActor</text>
  <text class="ti" x="1170" y="632" text-anchor="middle">为单个实体计算派生值</text>
  <text class="ti" x="1170" y="650" text-anchor="middle">随遥测变化实时重算</text>

  <!-- StatsActor -->
  <rect class="slate" x="1390" y="430" width="230" height="100" rx="12"/>
  <text class="bt2" x="1505" y="472" text-anchor="middle">StatsActor</text>
  <text class="ti" x="1505" y="498" text-anchor="middle">汇总运行指标</text>
  <text class="ti" x="1505" y="518" text-anchor="middle">用于观测</text>

  <!-- annotation panel -->
  <rect class="panel" x="60" y="700" width="770" height="260" rx="14"/>
  <text class="h" x="86" y="736">邮箱模型 · 串行处理</text>
  <text class="tx" x="86" y="770">每个实体都对应一个独立的 Actor，也就对应一个独立</text>
  <text class="tx" x="86" y="794">的邮箱。消息进入邮箱后排队，被一条一条地取出处理。</text>
  <text class="tx" x="86" y="818">这意味着同一台设备的状态，任何时刻都只有一个线程</text>
  <text class="tx" x="86" y="842">在修改——并发竞争因此从根本上消失，不再需要显式</text>
  <text class="tx" x="86" y="866">加锁。把「锁」换成了「排队」，是这套模型的精髓。</text>
  <text class="ti" x="86" y="904">common/actor · TbActorMailbox · DefaultTbActorSystem</text>
  <text class="ti" x="86" y="930">application/actors · TenantActor · DeviceActor · RuleChainActor</text>

  <rect class="panel" x="850" y="700" width="770" height="260" rx="14"/>
  <text class="h" x="876" y="736">监督与隔离 · 就地重启</text>
  <text class="tx" x="876" y="770">Actor 之间是父子监督关系，自上而下层层派生：系统</text>
  <text class="tx" x="876" y="794">根派生租户，租户再派生设备、规则链、计算字段。</text>
  <text class="tx" x="876" y="818">当某个 Actor 处理出错，影响范围被限制在它对应的</text>
  <text class="tx" x="876" y="842">那一个实体上；监督机制就地将它重启，不会波及其他</text>
  <text class="tx" x="876" y="866">实体，更不会扩散到整个系统。故障的半径很小。</text>
  <text class="ti" x="876" y="904">层级：AppActor → TenantActor → 设备 / 规则链 / 计算字段</text>
  <text class="ti" x="876" y="930">故障策略：InitFailureStrategy · ProcessFailureStrategy</text>
</svg>
