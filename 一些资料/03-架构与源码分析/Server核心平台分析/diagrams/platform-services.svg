<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="940" viewBox="0 0 1680 940" role="img" aria-labelledby="t d">
  <title id="t">支撑服务 · 环绕核心的一圈平台服务</title>
  <desc id="d">ThingsBoard 支撑服务：JS Executor 脚本沙箱、Version Control 配置版本化、Housekeeper 清理、Usage Stats 计量，环绕核心；Discovery 与 Partition Service 作为集群基础设施支撑全局。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc;}
      .title{font:800 34px 'Inter',Arial,sans-serif;fill:#0f172a;}
      .sub{font:400 16px 'Inter',Arial,sans-serif;fill:#475569;}
      .bt{font:800 19px 'Inter',Arial,sans-serif;fill:#0f172a;}
      .bt2{font:700 17px 'Inter',Arial,sans-serif;fill:#0f172a;}
      .tx{font:400 13.5px 'Inter',Arial,sans-serif;fill:#334155;}
      .ti{font:400 12.5px 'Inter',Arial,sans-serif;fill:#64748b;}
      .cd{font:600 12px Menlo,Consolas,monospace;fill:#475569;}
      .hub{fill:#eff6ff;stroke:#2563eb;stroke-width:2.6;}
      .svc{fill:#ffffff;stroke:#94a3b8;stroke-width:2;}
      .svcHi{fill:#fff1f2;stroke:#e11d48;stroke-width:2;}
      .found{fill:#fff1f2;stroke:#e11d48;stroke-width:2.4;}
      .line{fill:none;stroke:#94a3b8;stroke-width:2.2;stroke-dasharray:6 6;}
      .ar{fill:none;stroke:#e11d48;stroke-width:2.6;marker-end:url(#mr);}
      .lbl{font:600 12px Menlo,Consolas,monospace;fill:#64748b;}
    </style>
    <marker id="mr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M2,2 L9,5.5 L2,9 Z" fill="#e11d48"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1680" height="940"/>

  <text class="title" x="60" y="54">支撑服务 · 环绕核心的一圈服务</text>
  <text class="sub" x="62" y="84">不在主链路上、却缺一不可；脚本执行被关进沙箱，分区服务则是集群正确运转的关键</text>

  <!-- connection lines -->
  <line class="line" x1="480" y1="250" x2="612" y2="332"/>
  <line class="line" x1="1200" y1="250" x2="1068" y2="332"/>
  <line class="line" x1="480" y1="558" x2="612" y2="476"/>
  <line class="line" x1="1200" y1="558" x2="1068" y2="476"/>
  <text class="lbl" x="500" y="300">js-executor</text>
  <text class="lbl" x="1095" y="300" text-anchor="end">version-control</text>
  <text class="lbl" x="500" y="520">tb_housekeeper</text>
  <text class="lbl" x="1095" y="520" text-anchor="end">tb_usage_stats</text>

  <!-- hub -->
  <rect class="hub" x="612" y="300" width="456" height="180" rx="16"/>
  <text class="bt" x="840" y="378" text-anchor="middle">核心处理层</text>
  <text class="ti" x="840" y="406" text-anchor="middle">TB Core · TB Rule Engine</text>
  <text class="ti" x="840" y="430" text-anchor="middle">下面这一圈服务为它分担专门的职责</text>

  <!-- JS Executor (top-left, highlighted) -->
  <rect class="svcHi" x="120" y="148" width="380" height="150" rx="14"/>
  <text class="bt2" x="150" y="186">JS Executor</text>
  <text class="tx" x="150" y="214">规则脚本的沙箱执行环境</text>
  <text class="ti" x="150" y="238">远程 NodeJS 进程池，或本地引擎</text>
  <text class="ti" x="150" y="260">把不可信脚本与主进程隔离，避免相互影响</text>
  <text class="cd" x="150" y="284">msa/js-executor</text>

  <!-- Version Control (top-right) -->
  <rect class="svc" x="1180" y="148" width="380" height="150" rx="14"/>
  <text class="bt2" x="1210" y="186">Version Control</text>
  <text class="tx" x="1210" y="214">实体配置的版本化</text>
  <text class="ti" x="1210" y="238">对接 Git，配置变更可追溯、可回滚</text>
  <text class="ti" x="1210" y="260">由独立的 vc-executor 承载</text>
  <text class="cd" x="1210" y="284">msa/vc-executor</text>

  <!-- Housekeeper (bottom-left) -->
  <rect class="svc" x="120" y="540" width="380" height="150" rx="14"/>
  <text class="bt2" x="150" y="578">Housekeeper</text>
  <text class="tx" x="150" y="606">删除级联与过期清理</text>
  <text class="ti" x="150" y="630">实体删除后的级联清理</text>
  <text class="ti" x="150" y="652">按 TTL 清理过期数据，分批进行</text>
  <text class="cd" x="150" y="676">tb_housekeeper · reprocessing</text>

  <!-- Usage Stats (bottom-right) -->
  <rect class="svc" x="1180" y="540" width="380" height="150" rx="14"/>
  <text class="bt2" x="1210" y="578">Usage Stats</text>
  <text class="tx" x="1210" y="606">租户用量计量</text>
  <text class="ti" x="1210" y="630">统计各租户的消息量等用量</text>
  <text class="ti" x="1210" y="652">支撑配额与计费的依据</text>
  <text class="cd" x="1210" y="676">tb_usage_stats</text>

  <!-- arrow from foundation up to hub -->
  <line class="ar" x1="840" y1="746" x2="840" y2="484"/>

  <!-- foundation band -->
  <rect class="found" x="60" y="750" width="1560" height="160" rx="16"/>
  <text class="bt2" x="90" y="792" fill="#be123c">Discovery &amp; Partition Service · 集群基础设施</text>
  <text class="tx" x="90" y="824">借助 Zookeeper 完成服务发现，并以一致性哈希为每个实体分配归属节点。它回答的是一个根本问题：</text>
  <text class="tx" x="90" y="850">某一台设备的消息，究竟该由哪个节点来处理？当服务实例上线或下线时，分区会重新分配，负载随之再均衡。</text>
  <text class="ti" x="90" y="884">这一层决定了集群能否正确地横向扩展——它是分区机制（见消息总线）在运行期的承载者。</text>
</svg>
